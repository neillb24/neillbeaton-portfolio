<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stocking assistant — interactive preview</title>
<style>
@font-face{font-family:Poppins;src:url('assets/fonts/Poppins-Regular.ttf')}@font-face{font-family:Poppins;src:url('assets/fonts/Poppins-Bold.ttf');font-weight:700}
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#23232a;font-family:Poppins,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid #85858f;outline-offset:3px}.search:focus-within{border-color:#a9a9b3;box-shadow:0 0 0 2px #23232a08}.search input:focus,.search input:focus-visible{outline:none;box-shadow:none}[hidden]{display:none!important}.notice{background:#fff2cc;text-align:center;font-size:11px;padding:10px 16px;color:#64532a}.app{max-width:760px;padding:24px 22px 30px;margin:auto}h1{font-size:21px;line-height:1.3;margin:0 0 20px;letter-spacing:-.4px}.toolbar{display:flex;gap:10px;align-items:stretch}.search{background:white;border:1px solid #e2e2e7;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;flex:1;min-width:0}.search svg{width:17px;height:17px;flex:none;color:#72727d}.search input{background:none;border:0;min-width:0;width:100%;padding:14px 0;font-size:14px;outline-offset:0}.filters{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #dedee4;border-radius:14px;background:white;padding:0 15px;font-size:13px}.filters svg{width:18px;height:18px}.filters.active{color:#b32943;border-color:#ce6073;background:#fff6f8}.count{background:#be354e;border-radius:20px;padding:1px 6px;color:white;font-size:10px}.results{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:42px;font-size:11px;color:#73737c}.clear{background:none;border:0;color:#b32943;font-size:11px;padding:5px}.list{display:flex;flex-direction:column;gap:12px}.product-card{padding:19px 21px;background:white;border:1px solid #ebebef;border-radius:16px}.product-card h2{font-size:17px;line-height:1.4;margin:0 0 9px;font-weight:700;letter-spacing:-.25px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tag{font-size:10px;line-height:1.5;padding:3px 9px;border-radius:20px;background:#edf0f5;color:#52627b}.in{background:#e7f3e9;color:#397143}.out{background:#fbe8eb;color:#a23e50}.salvage{background:#fff2d8;color:#88601e}.quad{background:#eee8fb;color:#715694}.metrics{display:flex;gap:0;padding-top:0;align-items:center}.metric+.metric:before{content:"·";color:#a0a0aa;margin:0 12px}.metric{display:flex;align-items:center}.metric span{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#7b7b86}.metric strong{font-weight:400;font-size:13px;color:#3b3b46}.empty{text-align:center;padding:32px 20px;color:#666;font-size:14px}.empty button{margin-top:12px}dialog{width:min(440px,calc(100% - 32px));padding:0;border:1px solid #eee;border-radius:20px;box-shadow:0 24px 80px #0003;color:#23232a}dialog::backdrop{background:#23232a66}.dialog-body{padding:24px}dialog h2{font-size:21px;margin:0}dialog header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.close{width:32px;height:32px;border:0;background:#f4f4f6;border-radius:50%;font-size:20px}fieldset{border:0;padding:0;margin:0 0 20px}legend{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#74747f;margin-bottom:10px}label.option{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;cursor:pointer}input[type=checkbox]{accent-color:#be354e;width:17px;height:17px;margin:0}.dialog-actions{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ececf0;padding-top:18px}.apply{background:#be354e;border:0;color:white;border-radius:10px;padding:11px 20px;font-size:13px}.reset{border:0;background:none;color:#777;font-size:13px;padding:8px 0}@media(max-width:440px){.app{padding:20px 14px}h1{font-size:19px}.filters{padding:0 12px}.product-card{padding:17px}.metrics{gap:0}.search input{font-size:12px}.filters{font-size:12px}}
/* Restore the original product-card character; retain new toolbar and filters. */
.product-card{border:0;border-radius:20px;padding:14px 24px 12px}
.product-card h2{font-size:21px;line-height:1.35;letter-spacing:0;color:#333;margin:0 0 4px}
.tags{gap:5px;margin-bottom:5px}
.tag{font-size:12px;padding:2px 9px;background:#c7dcef;color:#2b2670}
.tag.in{background:#d4edda;color:#155724}
.tag.out,.tag.salvage{background:#f8d7da;color:#721c24}
.tag.quad{background:#fff0b5;color:#564200}
.metric strong{font-size:14px;color:#555;letter-spacing:.2px}
.metric+.metric:before{margin:0 9px;color:#777}
@media(max-width:440px){.product-card{padding:12px 18px 10px}.product-card h2{font-size:19px}.tag{font-size:11px}.metric strong{font-size:13px}}
/* Small alignment and spacing refinement. */
.product-card{padding:17px 24px 15px}
.product-card h2{margin:0 0 8px}
.tags{gap:5px;align-items:center;margin:0 0 9px}
.tag{font-size:11px;line-height:1.45;padding:2px 8px}
.metrics{line-height:1.5}
@media(max-width:440px){.product-card{padding:15px 18px 13px}.tag{font-size:10.5px}.product-card h2{margin-bottom:8px}}

.app{max-width:1000px}.scan-demo{margin-bottom:26px}.scan-heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:15px}.scan-heading h2{font-size:18px;margin:0 0 5px}.scan-heading p{font-size:12px;color:#72727d;margin:0}.scan-heading button{flex-shrink:0;background:#536c4d}.scan-stage{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}.photo-wrap{position:relative;border-radius:14px;overflow:hidden;height:280px;background:#e9e6dc}.photo-wrap img{width:100%;height:100%;object-fit:cover}.photo-label{position:absolute;left:10px;bottom:10px;background:#fffe;padding:5px 9px;border-radius:6px;font-size:11px}.scan-line{display:none;position:absolute;left:0;right:0;height:3px;background:#c7edaa;box-shadow:0 0 24px 9px #bce78c88;top:0}.scanning .scan-line{display:block;animation:scan 2s linear infinite}@keyframes scan{to{top:100%}}.sheet-wrap{background:white;border:1px solid #dedee4;border-radius:14px;overflow:hidden;min-width:0}.sheet-heading{padding:12px;font-size:11px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee}.sheet-heading span{color:#536c4d}.sheet-scroll{height:236px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:10px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eceef0}th{position:sticky;top:0;background:#f1f4ed;font-weight:400}td:first-child{min-width:145px}tbody tr{animation:appear .25s ease}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}.simulation-note,.mapping p{font-size:10px;color:#707078;line-height:1.6}.simulation-note{margin:10px 0}.mapping{font-size:11px;background:#eeeff0;border-radius:10px;padding:11px 13px}.mapping summary{cursor:pointer}#mapping-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}#mapping-list span{background:white;padding:4px 8px;border-radius:5px}.mapping p{margin-bottom:0}#show-cards{margin-top:7px;color:#536c4d}.scan-heading button:disabled{opacity:.6;cursor:wait}@media(max-width:600px){.scan-stage{grid-template-columns:1fr}.photo-wrap{height:210px}.scan-heading{align-items:flex-start}.scan-heading h2{font-size:16px}.scan-heading .apply{font-size:11px;padding:10px}.sheet-scroll{height:190px}}@media(prefers-reduced-motion:reduce){.scan-line{animation:none!important;top:50%}tbody tr{animation:none}}
</style></head><body><div class="notice">Adapted prototype · Fictional sample data · No live OCR</div><main class="app"><h1>Product Stocking Assistant</h1><div id="product-browser" class="toolbar"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input type="search" id="search" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="none" aria-label="Search sample products" placeholder="Search products or categories..."></label><button class="filters" id="filters" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="white"/><circle cx="15" cy="12" r="2" fill="white"/><circle cx="9" cy="18" r="2" fill="white"/></svg>Filters <span class="count" id="filter-count" hidden></span></button></div><div class="results"><span id="result-count" role="status" aria-live="polite"></span><button class="clear" id="clear" hidden>Clear all</button></div><div class="list" id="list"></div><div class="empty" id="empty" hidden>No products match your search and filters.<br><button class="clear" id="empty-clear">Clear all</button></div></main>
<dialog id="dialog" aria-labelledby="filter-title"><div class="dialog-body"><header><h2 id="filter-title">Filter products</h2><button class="close" id="close" aria-label="Close filters">×</button></header><fieldset><legend>Stock status</legend><label class="option"><input type="checkbox" name="stock" value="in">In Stock</label><label class="option"><input type="checkbox" name="stock" value="out">Out of Stock</label></fieldset><fieldset><legend>Attributes</legend><label class="option"><input type="checkbox" name="attr" value="salvage">High Salvage</label><label class="option"><input type="checkbox" name="attr" value="quad">High-value space (HVS)</label></fieldset><fieldset><legend>Locations</legend><label class="option"><input type="checkbox" name="location" value="Bread wall">Bread wall</label><label class="option"><input type="checkbox" name="location" value="Breakfast table">Breakfast table</label><label class="option"><input type="checkbox" name="location" value="Treats table">Treats table</label><label class="option"><input type="checkbox" name="location" value="Dessert case">Dessert case</label><label class="option"><input type="checkbox" name="location" value="Savory shelf">Savory shelf</label></fieldset><div class="dialog-actions"><button class="reset" id="reset">Reset filters</button><button class="apply" id="apply">Apply filters</button></div></div></dialog>
<script src="assets/products.js"></script><script>
const categoryLocations={"Hearth Breads":"Bread wall","Morning Pastries":"Breakfast table","Muffins & Scones":"Breakfast table","Cookie Boxes":"Treats table","Tarts & Bars":"Dessert case","Savory Bakes":"Savory shelf","Tea Cakes":"Dessert case","Rolls & Flatbreads":"Bread wall"};
const products=logProducts.map(p=>({...p,stock:p.onHand>0?'in':'out',location:categoryLocations[p.category],date:new Date(Date.UTC(2026,10,2+p.shelfLife)).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}),salvage:p.salvageRate>=10,quad:categoryLocations[p.category]==='Breakfast table'}));
const search=document.querySelector('#search'),dialog=document.querySelector('#dialog'),list=document.querySelector('#list');let selected={stock:[],attr:[],location:[]};
function render(){const q=search.value.trim().toLowerCase();const shown=products.filter(p=>(p.name+' '+p.category+' '+p.code+' '+p.location).toLowerCase().includes(q)&&(!selected.stock.length||selected.stock.includes(p.stock))&&selected.attr.every(a=>p[a])&&(!selected.location.length||selected.location.includes(p.location)));list.innerHTML=shown.map(p=>`<article class="product-card"><h2>${p.name}</h2><div class="tags"><span class="tag ${p.stock}">${p.stock==='in'?'In Stock':'Out of Stock'}</span><span class="tag">${p.location}</span>${p.salvage?'<span class="tag salvage">High Salvage</span>':''}${p.quad?'<span class="tag quad">HVS</span>':''}</div><div class="metrics"><div class="metric"><strong aria-label="Expiration ${p.date}">${p.date}</strong></div><div class="metric"><strong aria-label="Price ${p.price}">${p.price}</strong></div><div class="metric"><strong aria-label="Forecast ${p.forecast}">${p.forecast}</strong></div></div></article>`).join('');const n=Object.values(selected).flat().length;document.querySelector('#result-count').textContent=`${shown.length} of ${products.length} products`;document.querySelector('#empty').hidden=shown.length>0;document.querySelector('#clear').hidden=!(n||q);document.querySelector('#filter-count').hidden=!n;document.querySelector('#filter-count').textContent=n;document.querySelector('#filters').classList.toggle('active',n>0);}
search.addEventListener('input',render);document.querySelector('#filters').onclick=()=>{dialog.querySelectorAll('input').forEach(i=>i.checked=selected[i.name].includes(i.value));dialog.showModal();};document.querySelector('#close').onclick=()=>dialog.close();document.querySelector('#apply').onclick=()=>{for(const key of Object.keys(selected))selected[key]=Array.from(dialog.querySelectorAll(`input[name="${key}"]:checked`),i=>i.value);render();dialog.close();};document.querySelector('#reset').onclick=()=>dialog.querySelectorAll('input').forEach(i=>i.checked=false);function clearAll(){search.value='';selected={stock:[],attr:[],location:[]};render();}document.querySelector('#clear').onclick=clearAll;document.querySelector('#empty-clear').onclick=clearAll;dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});render();

</script></body></html>
